{% extends 'base.html' %}
{% load static %}

{% block title %}Registro de Usuario{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/formularios.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <a href="{% url 'usuarios' %}" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="form-title">Registro de Personal</h2>
    </div>

    <form method="POST" class="custom-form grid-form">
        {% csrf_token %}
        
        <div class="form-card">
            <h3 class="card-subtitle"><i class="fa-solid fa-id-card"></i> Datos Identificativos</h3>
            <div class="input-grid">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombre_completo" value="{{ usuario.nombre_completo|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>Cédula</label>
                    <input type="text" name="cedula" value="{{ usuario.cedula|default:'' }}" placeholder="V-00000000" required>
                </div>
                <div class="form-group">
                    <label>Email Corporativo</label>
                    <input type="email" name="email" value="{{ usuario.email|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>Perfil / Rol</label>
                    <select name="id_rol">
                        {% for rol in roles %}
                        <option value="{{ rol.id_rol }}" {% if usuario.id_rol.id_rol == rol.id_rol %}selected{% endif %}>{{ rol.nombre_rol }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="form-card">
            <h3 class="card-subtitle"><i class="fa-solid fa-building-columns"></i> Información Financiera</h3>
            <div class="input-grid">
                <div class="form-group">
                    <label>Banco</label>
                    <input type="text" name="banco" value="{{ usuario.banco|default:'' }}">
                </div>
                <div class="form-group">
                    <label>Cuenta Bancaria</label>
                    <input type="text" name="cuenta_bancaria" value="{{ usuario.cuenta_bancaria|default:'' }}">
                </div>
                <div class="form-group">
                    <label>Teléfono Móvil</label>
                    <input type="text" name="telefono_movil" value="{{ usuario.telefono_movil|default:'' }}">
                </div>
                <div class="form-group">
                    <label>Profesión / Oficio</label>
                    <input type="text" name="profesion_oficio" value="{{ usuario.profesion_oficio|default:'' }}">
                </div>
            </div>
        </div>

        <div class="form-actions-full">
            <button type="submit" class="btn-save large">
                <i class="fa-solid fa-user-check"></i> Finalizar Registro
            </button>
        </div>
    </form>
</div>
{% endblock %}
